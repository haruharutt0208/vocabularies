<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f5f5f7; --color-gray: #e4e4e8; --color-light-gray: #f0f0f2;
      --text-color: #000; --meaning-color: #ff6b00; --badge-text: #000;
    }
    body.dark-mode {
      --bg-color: #121212; --color-gray: #2a2a2c; --color-light-gray: #1c1c1e;
      --text-color: #fff; --meaning-color: #ff8533; --badge-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.light-mode) {
        --bg-color: #121212; --color-gray: #2a2a2c; --color-light-gray: #1c1c1e;
        --text-color: #fff; --meaning-color: #ff8533; --badge-text: #fff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 400;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; overflow: hidden;
    }
    .header-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; position: relative; }
    .title-card {
      width: 100%; height: 100%; background-color: var(--color-gray); border-radius: 16px;
      display: flex; justify-content: center; align-items: center; padding: 16px;
      text-align: center; font-size: 2.2rem; word-break: break-all;
    }
    .word-left-tap, .word-right-tap, .meaning-tap-left, .meaning-tap-right {
      position: absolute; top: 16px; bottom: 16px; width: calc(50% - 16px);
      background: transparent; cursor: pointer; z-index: 5; touch-action: manipulation;
    }
    .word-left-tap, .meaning-tap-left { left: 16px; }
    .word-right-tap, .meaning-tap-right { right: 16px; }
    .meaning-tap-left, .meaning-tap-right { top: 0; }
    .content-area { flex: 2; padding: 0 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; }
    .item-card {
      display: flex; align-items: center; padding: 10px 16px; border-radius: 12px;
      background-color: var(--color-light-gray); min-height: 54px; position: relative; z-index: 1; width: 100%;
    }
    .item-card.has-meaning, .item-card.menu-card:hover { background-color: var(--color-gray); }
    .item-card.menu-card { cursor: pointer; }
    .icon-badge, .count-badge {
      display: inline-flex; justify-content: center; align-items: center;
      height: 36px; color: var(--badge-text); background-color: var(--color-gray);
      border-radius: 8px; flex-shrink: 0; font-size: 1rem; opacity: 1 !important;
    }
    .icon-badge { width: 36px; margin-right: 14px; }
    .count-badge { min-width: 36px; padding: 0 6px; margin-left: 14px; }
    .meaning-text { font-size: 1.15rem; line-height: 1.4; color: var(--meaning-color); }
    .section-text { font-size: 1.15rem; line-height: 1.4; color: var(--text-color); flex: 1; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="header-area">
    <div id="mainDisplay" class="title-card"></div>
    <div id="wordLeftTap" class="word-left-tap"></div>
    <div id="wordRightTap" class="word-right-tap"></div>
  </div>

  <div id="contentContainer" class="content-area">
    <div id="meaningTapLeft" class="meaning-tap-left" onclick="handleMeaningLeftClick()" style="display: none;"></div>
    <div id="meaningTapRight" class="meaning-tap-right" onclick="handleMeaningRightClick()" style="display: none;"></div>
    <div id="listContent" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
  </div>

  <script>
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1kI0IS_wa0cWi7ZVBB_6Hf0Afgiy49CoXSQz720zbsyc/edit?gid=0#gid=0';
    const ALL_POS = ['自', '他', '名', '形', '副', '前', '接'];

    let notebooks = [], currentNotebookIndex = 0, currentSectionIndex = 0, currentWordIndex = 0;
    let visibleMeaningCount = 0, isStudyMode = false, longPressTimer = null, isLongPressTriggered = false;

    function loadDataWithJSONP() {
      const idMatch = SPREADSHEET_URL.match(/\/d\/([^\/]+)/), gidMatch = SPREADSHEET_URL.match(/gid=([0-9]+)/);
      if (!idMatch) return;
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/gviz/tq?tqx=responseHandler:handleGvizResponse&gid=${gidMatch ? gidMatch[1] : '0'}`;
      document.body.appendChild(script);
    }

    window.handleGvizResponse = res => {
      if (!res?.table?.rows) return;
      parseRowsToNotebooks(res.table.rows);
      showMenu();
    };

    function parseRowsToNotebooks(rows) {
      notebooks = [];
      let currentNotebook = null, currentSection = null;

      rows.forEach(row => {
        if (!row.c?.length) return;
        const firstCell = row.c[0]?.v !== undefined ? String(row.c[0].v).trim() : '';

        if (firstCell === '0') {
          currentNotebook = { title: row.c[1]?.v ? String(row.c[1].v).trim() : '単語帳', sections: [] };
          notebooks.push(currentNotebook);
          currentSection = null;
          return;
        }

        if (!currentNotebook) notebooks.push(currentNotebook = { title: '単語帳', sections: [] });

        if (firstCell === '1' || firstCell === '2') {
          currentSection = { type: firstCell, title: row.c[1]?.v ? String(row.c[1].v).trim() : 'セクション', words: [] };
          currentNotebook.sections.push(currentSection);
          return;
        }

        if (firstCell !== '' && currentSection) {
          const validMeanings = [], meaningsMap = {};
          if (currentSection.type === '1') {
            ALL_POS.forEach((pos, idx) => {
              const val = row.c[idx + 1]?.v != null ? String(row.c[idx + 1].v).trim() : '';
              if (val) { meaningsMap[pos] = val; validMeanings.push({ pos, text: val }); }
            });
          } else {
            const val = row.c[1]?.v != null ? String(row.c[1].v).trim() : '';
            if (val) validMeanings.push({ pos: '', text: val });
          }
          currentSection.words.push({ word: firstCell, meaningsMap, validMeanings });
        }
      });
    }

    function showMenu(e) {
      if (e) e.stopPropagation();
      isStudyMode = false;
      const container = document.getElementById('listContent');
      container.innerHTML = '';
      document.getElementById('meaningTapLeft').style.display = document.getElementById('meaningTapRight').style.display = 'none';

      if (!notebooks.length) return;
      const activeNotebook = notebooks[currentNotebookIndex];
      document.getElementById('mainDisplay').innerText = activeNotebook.title;

      activeNotebook.sections.forEach((sec, idx) => {
        const card = document.createElement('div');
        card.className = 'item-card menu-card';
        card.innerHTML = `<span class="section-text">${sec.title}</span><span class="count-badge">${sec.words.length}</span>`;
        card.onclick = () => startSection(idx);
        container.appendChild(card);
      });
    }

    function startSection(sectionIndex) {
      currentSectionIndex = sectionIndex;
      currentWordIndex = 0;
      isStudyMode = true;
      document.getElementById('meaningTapLeft').style.display = document.getElementById('meaningTapRight').style.display = 'block';
      setupWord();
    }

    function setupWord(showAllMeanings = false) {
      const section = notebooks[currentNotebookIndex]?.sections[currentSectionIndex];
      if (!section?.words.length) return;
      const wordData = section.words[currentWordIndex];
      document.getElementById('mainDisplay').innerText = wordData.word;
      visibleMeaningCount = showAllMeanings ? wordData.validMeanings.length : 0;
      renderMeanings();
    }

    function renderMeanings() {
      const section = notebooks[currentNotebookIndex].sections[currentSectionIndex];
      const wordData = section.words[currentWordIndex];
      const container = document.getElementById('listContent');
      container.innerHTML = '';
      const activeMeanings = wordData.validMeanings.slice(0, visibleMeaningCount);

      if (section.type === '1') {
        ALL_POS.forEach(pos => {
          const hasMeaning = wordData.meaningsMap.hasOwnProperty(pos);
          const isShown = activeMeanings.some(item => item.pos === pos);
          const card = document.createElement('div');
          card.className = `item-card ${hasMeaning ? 'has-meaning' : ''}`;
          card.innerHTML = `<span class="icon-badge">${pos}</span>` + 
                           (hasMeaning && isShown ? `<span class="meaning-text">${wordData.meaningsMap[pos]}</span>` : '');
          container.appendChild(card);
        });
      } else {
        const hasMeaning = wordData.validMeanings.length > 0;
        const card = document.createElement('div');
        card.className = `item-card ${hasMeaning ? 'has-meaning' : ''}`;
        if (hasMeaning && visibleMeaningCount > 0) {
          card.innerHTML = `<span class="meaning-text">${wordData.validMeanings[0].text}</span>`;
        }
        container.appendChild(card);
      }
    }

    const goToNextWord = () => currentWordIndex < notebooks[currentNotebookIndex].sections[currentSectionIndex].words.length - 1 ? (currentWordIndex++, setupWord()) : showMenu();
    const goToPrevWord = (showAll = true) => { if (currentWordIndex > 0) { currentWordIndex--; setupWord(showAll); } };

    function toggleDarkMode() {
      const body = document.body;
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (body.classList.contains('dark-mode')) body.className = 'light-mode';
      else if (body.classList.contains('light-mode')) body.className = 'dark-mode';
      else body.className = isSystemDark ? 'light-mode' : 'dark-mode';
    }

    const startLongPress = () => {
      isLongPressTriggered = false;
      longPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        isStudyMode ? showMenu() : toggleDarkMode();
      }, 1000);
    };
    const cancelLongPress = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };

    function bindTapEvents(el, clickHandler) {
      el.addEventListener('pointerdown', e => { e.preventDefault(); startLongPress(); });
      el.addEventListener('pointerup', e => {
        e.preventDefault();
        cancelLongPress();
        if (!isLongPressTriggered) clickHandler();
      });
      el.addEventListener('pointercancel', cancelLongPress);
      el.addEventListener('pointerleave', cancelLongPress);
    }

    bindTapEvents(document.getElementById('wordLeftTap'), () => {
      if (isStudyMode) {
        const total = notebooks[currentNotebookIndex].sections[currentSectionIndex].words[currentWordIndex].validMeanings.length;
        visibleMeaningCount === total ? (visibleMeaningCount = 0, renderMeanings()) : goToPrevWord(true);
      } else if (notebooks.length > 1) {
        currentNotebookIndex = (currentNotebookIndex - 1 + notebooks.length) % notebooks.length;
        showMenu();
      }
    });

    bindTapEvents(document.getElementById('wordRightTap'), () => {
      if (isStudyMode) {
        const total = notebooks[currentNotebookIndex].sections[currentSectionIndex].words[currentWordIndex].validMeanings.length;
        visibleMeaningCount < total ? (visibleMeaningCount = total, renderMeanings()) : goToNextWord();
      } else if (notebooks.length > 1) {
        currentNotebookIndex = (currentNotebookIndex + 1) % notebooks.length;
        showMenu();
      }
    });

    function handleMeaningLeftClick() {
      if (!isStudyMode) return;
      if (visibleMeaningCount > 0) { visibleMeaningCount--; renderMeanings(); }
      else goToPrevWord(true);
    }

    function handleMeaningRightClick() {
      if (!isStudyMode) return;
      const total = notebooks[currentNotebookIndex].sections[currentSectionIndex].words[currentWordIndex].validMeanings.length;
      visibleMeaningCount < total ? (visibleMeaningCount++, renderMeanings()) : goToNextWord();
    }

    window.addEventListener('DOMContentLoaded', loadDataWithJSONP);
  </script>
</body>
</html>
