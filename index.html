<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f5f5f7; --color-gray: #e4e4e8; --color-light-gray: #f0f0f2;
      --text-color: #000; --meaning-color: #ff6b00; --badge-text: #000; --press-red: #ffcccc;
    }
    body.dark-mode {
      --bg-color: #121212; --color-gray: #2a2a2c; --color-light-gray: #1c1c1e;
      --text-color: #fff; --meaning-color: #ff8533; --badge-text: #fff; --press-red: #4a2424;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.light-mode) {
        --bg-color: #121212; --color-gray: #2a2a2c; --color-light-gray: #1c1c1e;
        --text-color: #fff; --meaning-color: #ff8533; --badge-text: #fff; --press-red: #4a2424;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; overflow: hidden;
    }
    .header-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .title-card {
      width: 100%; height: 100%; background-color: var(--color-light-gray); border-radius: 16px;
      display: flex; justify-content: center; align-items: center; padding: 16px;
      text-align: center; font-size: 2.2rem; word-break: break-all; cursor: pointer; border: 2px solid transparent;
    }
    .title-card.important { border-color: #ff3b30; }
    .title-card.press-gray { background-color: var(--color-gray) !important; }

    .content-area { flex: 2; padding: 0 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; }
    .meaning-tap-left, .meaning-tap-right {
      position: absolute; top: 0; bottom: 16px; width: calc(50% - 16px); z-index: 5; touch-action: manipulation;
    }
    .meaning-tap-left { left: 16px; } .meaning-tap-right { right: 16px; }
    .item-card {
      display: flex; align-items: center; padding: 10px 16px; border-radius: 12px;
      background-color: var(--color-light-gray); min-height: 54px; z-index: 1; width: 100%;
    }
    .item-card.has-meaning { background-color: var(--color-gray); }
    .item-card.menu-card { cursor: pointer; }
    .item-card.press-gray { background-color: var(--color-gray) !important; }
    .item-card.press-red { background-color: var(--press-red) !important; }
    
    .icon-badge, .count-badge, .important-count-badge {
      display: inline-flex; justify-content: center; align-items: center; height: 36px;
      color: var(--badge-text); border-radius: 8px; flex-shrink: 0;
    }
    .icon-badge, .count-badge { background-color: var(--color-gray); }
    .count-badge { min-width: 36px; padding: 0 6px; margin-left: 14px; }
    .important-count-badge { background-color: var(--press-red); min-width: 36px; padding: 0 6px; margin-left: 6px; }
    .item-card.press-red .important-count-badge { background-color: var(--press-red) !important; }

    .icon-badge { width: 36px; margin-right: 14px; }
    .meaning-text { font-size: 1.15rem; line-height: 1.4; color: var(--meaning-color); }
    .section-text { font-size: 1.15rem; line-height: 1.4; flex: 1; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="header-area"><div id="mainDisplay" class="title-card"></div></div>
  <div id="contentContainer" class="content-area">
    <div id="meaningTapLeft" class="meaning-tap-left" onclick="handleMeaningLeftClick()" style="display:none;"></div>
    <div id="meaningTapRight" class="meaning-tap-right" onclick="handleMeaningRightClick()" style="display:none;"></div>
    <div id="listContent" style="display:flex; flex-direction:column; gap:12px; width:100%;"></div>
  </div>

  <script>
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1kI0IS_wa0cWi7ZVBB_6Hf0Afgiy49CoXSQz720zbsyc/edit?gid=0#gid=0';
    const ALL_POS = ['自', '他', '名', '形', '副', '前', '接'];
    let notebooks = [], currentNotebookIndex = 0, currentSectionIndex = 0, currentWordIndex = 0;
    let activeWords = [], visibleMeaningCount = 0, isStudyMode = false, headerPressTimer = null, isHeaderLongPress = false;
    let importantMap = JSON.parse(localStorage.getItem('importantWordsMap') || '{}');

    function loadDataWithJSONP() {
      const idMatch = SPREADSHEET_URL.match(/\/d\/([^\/]+)/), gidMatch = SPREADSHEET_URL.match(/gid=([0-9]+)/);
      if (!idMatch) return;
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/gviz/tq?tqx=responseHandler:handleGvizResponse&gid=${gidMatch ? gidMatch[1] : '0'}`;
      document.body.appendChild(script);
    }

    window.handleGvizResponse = res => {
      if (!res?.table?.rows) return;
      parseRowsToNotebooks(res.table.rows);
      showMenu();
    };

    function parseRowsToNotebooks(rows) {
      notebooks = [];
      let currentNotebook = null, currentSection = null;
      rows.forEach(row => {
        if (!row.c?.length) return;
        const firstCell = row.c[0]?.v !== undefined ? String(row.c[0].v).trim() : '';
        if (firstCell === '0') {
          notebooks.push(currentNotebook = { title: row.c[1]?.v ? String(row.c[1].v).trim() : '単語帳', sections: [] });
          currentSection = null; return;
        }
        if (!currentNotebook) notebooks.push(currentNotebook = { title: '単語帳', sections: [] });
        if (firstCell === '1' || firstCell === '2') {
          currentNotebook.sections.push(currentSection = { type: firstCell, title: row.c[1]?.v ? String(row.c[1].v).trim() : 'セクション', words: [] });
          return;
        }
        if (firstCell !== '' && currentSection) {
          const validMeanings = [], meaningsMap = {};
          if (currentSection.type === '1') {
            ALL_POS.forEach((pos, idx) => {
              const val = row.c[idx + 1]?.v != null ? String(row.c[idx + 1].v).trim() : '';
              if (val) { meaningsMap[pos] = val; validMeanings.push({ pos, text: val }); }
            });
          } else {
            const val = row.c[1]?.v != null ? String(row.c[1].v).trim() : '';
            if (val) validMeanings.push({ pos: '', text: val });
          }
          currentSection.words.push({ word: firstCell, meaningsMap, validMeanings });
        }
      });
    }

    function showMenu(e) {
      if (e) e.stopPropagation();
      isStudyMode = false;
      const container = document.getElementById('listContent');
      container.innerHTML = '';
      document.getElementById('meaningTapLeft').style.display = document.getElementById('meaningTapRight').style.display = 'none';
      
      const mainDisplay = document.getElementById('mainDisplay');
      mainDisplay.classList.remove('important', 'press-gray');

      if (!notebooks.length) return;
      mainDisplay.innerText = notebooks[currentNotebookIndex].title;

      notebooks[currentNotebookIndex].sections.forEach((sec, idx) => {
        const impCount = sec.words.filter(w => importantMap[w.word]).length;
        const card = document.createElement('div');
        card.className = 'item-card menu-card';
        card.innerHTML = `<span class="section-text">${sec.title}</span>` +
                         `<span class="count-badge">${sec.words.length}</span>` +
                         `<span class="important-count-badge">${impCount}</span>`;

        let timer1 = null, timer2 = null, pressMode = 'normal';

        const clearTimers = () => {
          clearTimeout(timer1); clearTimeout(timer2);
          card.classList.remove('press-gray', 'press-red');
        };

        const startPress = () => {
          pressMode = 'normal';
          timer1 = setTimeout(() => {
            pressMode = 'shuffle';
            card.classList.add('press-gray');
          }, 1000);
          timer2 = setTimeout(() => {
            pressMode = 'important';
            card.classList.remove('press-gray');
            card.classList.add('press-red');
          }, 2000);
        };

        const endPress = () => {
          clearTimers();
          startSection(idx, pressMode);
        };

        card.addEventListener('pointerdown', startPress);
        card.addEventListener('pointerup', endPress);
        card.addEventListener('pointerleave', clearTimers);
        card.addEventListener('pointercancel', clearTimers);

        container.appendChild(card);
      });
    }

    function startSection(sectionIndex, mode = 'normal') {
      let words = [...notebooks[currentNotebookIndex].sections[sectionIndex].words];
      if (mode === 'important') {
        words = words.filter(w => importantMap[w.word]);
        if (!words.length) return;
      }
      if (mode === 'shuffle' || mode === 'important') {
        for (let i = words.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [words[i], words[j]] = [words[j], words[i]];
        }
      }
      currentSectionIndex = sectionIndex;
      currentWordIndex = 0;
      isStudyMode = true;
      activeWords = words;
      document.getElementById('meaningTapLeft').style.display = document.getElementById('meaningTapRight').style.display = 'block';
      setupWord();
    }

    function setupWord(fullMeanings = false) {
      if (!activeWords.length) return;
      const wordData = activeWords[currentWordIndex];
      const mainDisplay = document.getElementById('mainDisplay');
      mainDisplay.innerText = wordData.word;
      mainDisplay.classList.remove('press-gray');
      mainDisplay.classList.toggle('important', !!importantMap[wordData.word]);
      visibleMeaningCount = fullMeanings ? wordData.validMeanings.length : 0;
      renderMeanings();
    }

    function toggleImportant() {
      if (!isStudyMode || !activeWords.length) return;
      const word = activeWords[currentWordIndex].word;
      importantMap[word] = !importantMap[word];
      localStorage.setItem('importantWordsMap', JSON.stringify(importantMap));
      document.getElementById('mainDisplay').classList.toggle('important', importantMap[word]);
    }

    function renderMeanings() {
      const section = notebooks[currentNotebookIndex].sections[currentSectionIndex];
      const wordData = activeWords[currentWordIndex];
      const container = document.getElementById('listContent');
      container.innerHTML = '';
      const activeMeanings = wordData.validMeanings.slice(0, visibleMeaningCount);

      if (section.type === '1') {
        ALL_POS.forEach(pos => {
          const hasMeaning = wordData.meaningsMap.hasOwnProperty(pos);
          const isShown = activeMeanings.some(item => item.pos === pos);
          const card = document.createElement('div');
          card.className = `item-card ${hasMeaning ? 'has-meaning' : ''}`;
          card.innerHTML = `<span class="icon-badge">${pos}</span>` + 
                           (hasMeaning && isShown ? `<span class="meaning-text">${wordData.meaningsMap[pos]}</span>` : '');
          container.appendChild(card);
        });
      } else {
        const card = document.createElement('div');
        card.className = `item-card ${wordData.validMeanings.length ? 'has-meaning' : ''}`;
        if (wordData.validMeanings.length && visibleMeaningCount > 0) {
          card.innerHTML = `<span class="meaning-text">${wordData.validMeanings[0].text}</span>`;
        }
        container.appendChild(card);
      }
    }

    const goToNextWord = () => currentWordIndex < activeWords.length - 1 ? (currentWordIndex++, setupWord()) : showMenu();

    function toggleDarkMode() {
      const body = document.body;
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (body.classList.contains('dark-mode')) body.className = 'light-mode';
      else if (body.classList.contains('light-mode')) body.className = 'dark-mode';
      else body.className = isSystemDark ? 'light-mode' : 'dark-mode';
    }

    const mainDisplayEl = document.getElementById('mainDisplay');
    
    const cancelHeaderPress = () => {
      if (headerPressTimer) clearTimeout(headerPressTimer);
      headerPressTimer = null;
      mainDisplayEl.classList.remove('press-gray');
    };

    mainDisplayEl.addEventListener('pointerdown', e => {
      e.preventDefault();
      isHeaderLongPress = false;
      cancelHeaderPress();
      headerPressTimer = setTimeout(() => {
        isHeaderLongPress = true;
        mainDisplayEl.classList.add('press-gray');
      }, 1000);
    });

    mainDisplayEl.addEventListener('pointerup', e => {
      e.preventDefault();
      if (isHeaderLongPress) {
        cancelHeaderPress();
        if (isStudyMode) showMenu();
        else toggleDarkMode();
      } else {
        cancelHeaderPress();
        if (isStudyMode) toggleImportant();
      }
    });

    mainDisplayEl.addEventListener('pointercancel', cancelHeaderPress);
    mainDisplayEl.addEventListener('pointerleave', cancelHeaderPress);

    function handleMeaningLeftClick() {
      if (!isStudyMode) return;
      if (visibleMeaningCount > 0) {
        visibleMeaningCount--;
        renderMeanings();
      } else if (currentWordIndex > 0) {
        currentWordIndex--;
        setupWord(true);
      }
    }

    function handleMeaningRightClick() {
      if (!isStudyMode) return;
      const total = activeWords[currentWordIndex].validMeanings.length;
      visibleMeaningCount < total ? (visibleMeaningCount++, renderMeanings()) : goToNextWord();
    }

    window.addEventListener('DOMContentLoaded', loadDataWithJSONP);
  </script>
</body>
</html>
