<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku Gothic+New:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f5f5f7;
      --color-gray: #e4e4e8;
      --color-light-gray: #f0f0f2;
      --text-color: #000000;
      --meaning-color: #ff6b00;
      --badge-bg: rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      --bg-color: #121212;
      --color-gray: #2a2a2c;
      --color-light-gray: #1c1c1e;
      --text-color: #ffffff;
      --meaning-color: #ff8533;
      --badge-bg: rgba(255, 255, 255, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      body:not(.light-mode) {
        --bg-color: #121212;
        --color-gray: #2a2a2c;
        --color-light-gray: #1c1c1e;
        --text-color: #ffffff;
        --meaning-color: #ff8533;
        --badge-bg: rgba(255, 255, 255, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-weight: 400;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .header-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    .title-card {
      width: 100%;
      height: 100%;
      background-color: var(--color-gray);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 400;
      word-break: break-all;
    }

    .word-left-tap, .word-right-tap {
      position: absolute;
      top: 16px;
      bottom: 16px;
      width: calc(50% - 16px);
      background: transparent;
      cursor: pointer;
      z-index: 5;
      touch-action: manipulation;
    }

    .word-left-tap { left: 16px; }
    .word-right-tap { right: 16px; }

    .content-area {
      flex: 2;
      padding: 0 16px 16px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .item-card {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 12px;
      background-color: var(--color-light-gray);
      min-height: 54px;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .item-card.has-meaning {
      background-color: var(--color-gray);
    }

    .item-card.menu-card {
      background-color: var(--color-light-gray);
      cursor: pointer;
    }

    .item-card.menu-card:hover {
      background-color: var(--color-gray);
    }

    .icon-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 36px;
      height: 36px;
      font-weight: 400;
      color: var(--text-color);
      background-color: var(--color-gray);
      border-radius: 8px;
      margin-right: 14px;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .icon-badge.disabled {
      opacity: 0.25;
    }

    .count-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 36px;
      height: 36px;
      padding: 0 6px;
      font-weight: 400;
      color: var(--text-color);
      background-color: var(--badge-bg);
      border-radius: 8px;
      margin-left: 14px;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .item-card.menu-card:hover .count-badge {
      background-color: var(--color-gray);
    }

    .meaning-text {
      font-size: 1.15rem;
      line-height: 1.4;
      color: var(--meaning-color);
      font-weight: 400;
    }

    .section-text {
      font-size: 1.15rem;
      line-height: 1.4;
      color: var(--text-color);
      font-weight: 400;
      flex: 1;
    }

    .meaning-tap-overlay {
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: transparent;
      cursor: pointer;
      z-index: 5;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="header-area">
    <div id="mainDisplay" class="title-card"></div>
    <div id="wordLeftTap" class="word-left-tap"></div>
    <div id="wordRightTap" class="word-right-tap"></div>
  </div>

  <div id="contentContainer" class="content-area">
    <div id="meaningTapOverlay" class="meaning-tap-overlay" onclick="handleMeaningClick()" style="display: none;"></div>
    <div id="listContent" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
  </div>

  <script>
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1kI0IS_wa0cWi7ZVBB_6Hf0Afgiy49CoXSQz720zbsyc/edit?gid=0#gid=0';
    const ALL_POS = ['自', '他', '名', '形', '副', '前', '接'];

    let notebooks = [];
    let currentNotebookIndex = 0;
    let currentSectionIndex = 0;
    let currentWordIndex = 0;
    let visibleMeaningCount = 0;
    let isStudyMode = false;
    let longPressTimer = null;
    let isLongPressTriggered = false;

    function loadDataWithJSONP() {
      try {
        const idMatch = SPREADSHEET_URL.match(/\/d\/([^\/]+)/);
        const gidMatch = SPREADSHEET_URL.match(/gid=([0-9]+)/);
        if (!idMatch) return;

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/gviz/tq?tqx=responseHandler:handleGvizResponse&gid=${gidMatch ? gidMatch[1] : '0'}`;
        document.body.appendChild(script);
      } catch (e) {}
    }

    window.handleGvizResponse = function(response) {
      if (!response || !response.table || !response.table.rows) return;
      parseRowsToNotebooks(response.table.rows);
      showMenu();
    };

    function parseRowsToNotebooks(rows) {
      notebooks = [];
      let currentNotebook = null;
      let currentSection = null;

      rows.forEach(row => {
        if (!row.c || row.c.length === 0) return;
        const firstCell = row.c[0] ? String(row.c[0].v).trim() : '';

        if (firstCell === '0') {
          currentNotebook = {
            title: (row.c[1] && row.c[1].v) ? String(row.c[1].v).trim() : '単語帳',
            sections: []
          };
          notebooks.push(currentNotebook);
          currentSection = null;
          return;
        }

        if (!currentNotebook) {
          currentNotebook = { title: '単語帳', sections: [] };
          notebooks.push(currentNotebook);
        }

        if (firstCell === '1' || firstCell === '2') {
          currentSection = {
            type: firstCell,
            title: (row.c[1] && row.c[1].v) ? String(row.c[1].v).trim() : 'セクション',
            words: []
          };
          currentNotebook.sections.push(currentSection);
          return;
        }

        if (firstCell !== '' && currentSection) {
          const validMeanings = [];
          const meaningsMap = {};

          if (currentSection.type === '1') {
            ALL_POS.forEach((pos, index) => {
              const cell = row.c[index + 1];
              if (cell && cell.v !== null && cell.v !== undefined) {
                const val = String(cell.v).trim();
                if (val !== '') {
                  meaningsMap[pos] = val;
                  validMeanings.push({ pos: pos, text: val });
                }
              }
            });
          } else {
            const cell = row.c[1];
            if (cell && cell.v !== null && cell.v !== undefined) {
              const val = String(cell.v).trim();
              if (val !== '') validMeanings.push({ pos: '', text: val });
            }
          }

          currentSection.words.push({ word: firstCell, meaningsMap, validMeanings });
        }
      });
    }

    function showMenu(e) {
      if (e) e.stopPropagation();
      isStudyMode = false;

      const container = document.getElementById('listContent');
      container.innerHTML = '';
      document.getElementById('meaningTapOverlay').style.display = 'none';

      if (notebooks.length === 0) return;

      const activeNotebook = notebooks[currentNotebookIndex];
      document.getElementById('mainDisplay').innerText = activeNotebook.title;

      activeNotebook.sections.forEach((sec, index) => {
        const card = document.createElement('div');
        card.className = 'item-card menu-card';

        const text = document.createElement('span');
        text.className = 'section-text';
        text.innerText = sec.title;

        const countBadge = document.createElement('span');
        countBadge.className = 'count-badge';
        countBadge.innerText = sec.words.length;

        card.appendChild(text);
        card.appendChild(countBadge);
        card.onclick = () => startSection(index);
        container.appendChild(card);
      });
    }

    function startSection(sectionIndex) {
      currentSectionIndex = sectionIndex;
      currentWordIndex = 0;
      isStudyMode = true;
      document.getElementById('meaningTapOverlay').style.display = 'block';
      setupWord();
    }

    function setupWord() {
      const activeNotebook = notebooks[currentNotebookIndex];
      const section = activeNotebook ? activeNotebook.sections[currentSectionIndex] : null;
      if (!section || section.words.length === 0) return;

      const wordData = section.words[currentWordIndex];
      document.getElementById('mainDisplay').innerText = wordData.word;
      visibleMeaningCount = 0;
      renderMeanings();
    }

    function renderMeanings() {
      const activeNotebook = notebooks[currentNotebookIndex];
      const section = activeNotebook.sections[currentSectionIndex];
      const wordData = section.words[currentWordIndex];
      const container = document.getElementById('listContent');
      container.innerHTML = '';

      const activeMeanings = wordData.validMeanings.slice(0, visibleMeaningCount);

      if (section.type === '1') {
        ALL_POS.forEach(pos => {
          const hasMeaning = wordData.meaningsMap.hasOwnProperty(pos);
          const isShown = activeMeanings.some(item => item.pos === pos);

          const card = document.createElement('div');
          card.className = `item-card ${hasMeaning ? 'has-meaning' : ''}`;

          const badge = document.createElement('span');
          badge.className = `icon-badge ${hasMeaning ? '' : 'disabled'}`;
          badge.innerText = pos;
          card.appendChild(badge);

          if (hasMeaning && isShown) {
            const text = document.createElement('span');
            text.className = 'meaning-text';
            text.innerText = wordData.meaningsMap[pos];
            card.appendChild(text);
          }

          container.appendChild(card);
        });
      } else {
        const hasMeaning = wordData.validMeanings.length > 0;
        const isShown = visibleMeaningCount > 0;

        const card = document.createElement('div');
        card.className = `item-card ${hasMeaning ? 'has-meaning' : ''}`;

        if (hasMeaning && isShown) {
          const text = document.createElement('span');
          text.className = 'meaning-text';
          text.innerText = wordData.validMeanings[0].text;
          card.appendChild(text);
        }

        container.appendChild(card);
      }
    }

    function goToNextWord() {
      const section = notebooks[currentNotebookIndex].sections[currentSectionIndex];
      if (currentWordIndex < section.words.length - 1) {
        currentWordIndex++;
        setupWord();
      } else {
        showMenu();
      }
    }

    function toggleDarkMode() {
      const body = document.body;
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (body.classList.contains('dark-mode')) {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
      } else if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
      } else {
        if (isSystemDark) {
          body.classList.add('light-mode');
        } else {
          body.classList.add('dark-mode');
        }
      }
    }

    function startLongPress() {
      isLongPressTriggered = false;
      longPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        if (isStudyMode) {
          showMenu();
        } else {
          toggleDarkMode();
        }
      }, 1000);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    const wordLeftEl = document.getElementById('wordLeftTap');
    wordLeftEl.addEventListener('pointerdown', (e) => { e.preventDefault(); startLongPress(); });
    wordLeftEl.addEventListener('pointerup', (e) => {
      e.preventDefault();
      cancelLongPress();
      if (!isLongPressTriggered) handleLeftClick();
    });
    wordLeftEl.addEventListener('pointercancel', cancelLongPress);
    wordLeftEl.addEventListener('pointerleave', cancelLongPress);

    function handleLeftClick() {
      if (isStudyMode) {
        if (visibleMeaningCount > 0) {
          visibleMeaningCount = 0;
          renderMeanings();
        } else if (currentWordIndex > 0) {
          currentWordIndex--;
          setupWord();
        }
      } else if (notebooks.length > 1) {
        currentNotebookIndex = (currentNotebookIndex - 1 + notebooks.length) % notebooks.length;
        showMenu();
      }
    }

    const wordRightEl = document.getElementById('wordRightTap');
    wordRightEl.addEventListener('pointerdown', (e) => { e.preventDefault(); startLongPress(); });
    wordRightEl.addEventListener('pointerup', (e) => {
      e.preventDefault();
      cancelLongPress();
      if (!isLongPressTriggered) handleRightClick();
    });
    wordRightEl.addEventListener('pointercancel', cancelLongPress);
    wordRightEl.addEventListener('pointerleave', cancelLongPress);

    function handleRightClick() {
      if (isStudyMode) {
        const section = notebooks[currentNotebookIndex].sections[currentSectionIndex];
        const wordData = section.words[currentWordIndex];
        const totalMeanings = wordData.validMeanings.length;

        if (visibleMeaningCount < totalMeanings) {
          visibleMeaningCount = totalMeanings;
          renderMeanings();
        } else {
          goToNextWord();
        }
      } else if (notebooks.length > 1) {
        currentNotebookIndex = (currentNotebookIndex + 1) % notebooks.length;
        showMenu();
      }
    }

    function handleMeaningClick() {
      if (!isStudyMode) return;
      const section = notebooks[currentNotebookIndex].sections[currentSectionIndex];
      const wordData = section.words[currentWordIndex];
      const totalMeanings = wordData.validMeanings.length;

      if (visibleMeaningCount < totalMeanings) {
        visibleMeaningCount++;
        renderMeanings();
      } else {
        goToNextWord();
      }
    }

    window.addEventListener('DOMContentLoaded', loadDataWithJSONP);
  </script>
</body>
</html>
